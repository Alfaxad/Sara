services:
  iris:
    image: containers.intersystems.com/intersystems/irishealth-community:2026.1
    platform: linux/arm64
    container_name: sara-iris-health
    ports:
      - "1972:1972"
      - "52773:52773"
    environment:
      IRIS_PASSWORD: "${IRIS_PASSWORD:?Set IRIS_PASSWORD before starting the IRIS container}"
      IRIS_FHIR_URL: "http://localhost:52773/fhir/r4"
      IRIS_FHIR_USERNAME: "_SYSTEM"
      IRIS_FHIR_PASSWORD: "${IRIS_PASSWORD:?Set IRIS_PASSWORD before starting the IRIS container}"
    volumes:
      - ./:/irisdev/app
    command: ["--check-caps", "false"]

  sara-api:
    image: python:3.12-slim
    container_name: sara-for-iris-api
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      IRIS_FHIR_URL: "http://iris:52773/fhir/r4"
      IRIS_FHIR_USERNAME: "_SYSTEM"
      IRIS_FHIR_PASSWORD: "${IRIS_PASSWORD:?Set IRIS_PASSWORD before starting the IRIS container}"
    volumes:
      - ./:/app
    command: >
      sh -lc "pip install fastapi[standard] uvicorn pydantic httpx openai &&
      uvicorn src.backend.sara_iris_agent:local_app --host 0.0.0.0 --port 8000"
    depends_on:
      - iris
